<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="pl-mono-light-title">
  <title id="pl-mono-light-title">PaperLume</title>
  <!--
    Single-colour mark. The beam and fold are knocked out of the page rather
    than painted, so the mark carries no second colour at all.

    The knockouts are clipped to an inset copy of the page outline, which is
    what keeps the page silhouette unbroken: a beam taken all the way to the
    edge would sever the outline and the shape would stop reading as a page.
  -->
  <defs>
    <clipPath id="pl-mono-light-inset">
      <path d="M12 8 A3 3 0 0 1 15 5 H39 L52 18 V56 A3 3 0 0 1 49 59 H15 A3 3 0 0 1 12 56 Z" transform="translate(32,32) scale(0.88) translate(-32,-32)"/>
    </clipPath>
    <mask id="pl-mono-light-mask">
      <rect width="64" height="64" fill="#000000"/>
      <path d="M12 8 A3 3 0 0 1 15 5 H39 L52 18 V56 A3 3 0 0 1 49 59 H15 A3 3 0 0 1 12 56 Z" fill="#FFFFFF"/>
      <g clip-path="url(#pl-mono-light-inset)">
        <path d="M39 18 L12 41 V59 H29 Z" fill="#000000"/>
        <path d="M39 5 L52 18 H39 Z" fill="#000000"/>
      </g>
    </mask>
  </defs>
  <rect width="64" height="64" fill="#FFFFFF" mask="url(#pl-mono-light-mask)"/>
</svg>
