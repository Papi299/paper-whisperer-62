    <!-- The canonical PaperLume symbol, taken straight from the brand pack
         (assets/brand/brand-spec.md); Vite emits both as hashed build assets.

    <link rel="icon" type="image/svg+xml" href="/assets/brand/svg/paperlume-symbol.svg" />
    <title>PaperLume</title>
    <meta name="description" content="Manage your scientific paper collections" />

    <meta property="og:title" content="PaperLume" />
    <meta property="og:description" content="Manage your scientific paper collections" />
    <meta property="og:type" content="website" />
